# Minimal config for Phase 1 smoke (mock embeddings — no external API).
active_profile: smoke

profiles:
  smoke:
    description: Mock OpenAI-compatible embeddings for smoke tests
    provider: openai_compatible
    model: mock-embed
    base_url: http://127.0.0.1:9999/v1
    dimensions: 128
    batch_size: 32
    timeout_seconds: 10

indexing:
  extensions: [".go", ".md"]
  skip_dirs: [".git", "node_modules", "vendor", ".deps"]

search:
  slow_threshold_seconds: 5.0

file_watcher:
  enabled: false

logging:
  level: info

server:
  http_addr: ":8080"
