# Minimal config for Docker daemon smoke (mock embeddings on host).
active_profile: smoke

profiles:
  smoke:
    description: Mock OpenAI-compatible embeddings for Docker smoke tests
    provider: openai_compatible
    model: mock-embed
    base_url: http://host.docker.internal:9999/v1
    dimensions: 128
    batch_size: 32
    timeout_seconds: 10

indexing:
  extensions: [".go"]
  skip_dirs: [".git", "node_modules", "vendor", ".deps", ".mcp-semantic-search-zvec-go"]

search:
  slow_threshold_seconds: 30.0

file_watcher:
  enabled: false

logging:
  level: info

server:
  http_addr: ":8080"
