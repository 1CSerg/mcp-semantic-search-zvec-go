# Realworld harness — local ONNX profile (offline embeddings).
active_profile: local_multilingual

profiles:
  local_multilingual:
    description: Local multilingual ONNX realworld profile
    provider: onnx
    model: paraphrase-multilingual-MiniLM-L12-v2
    dimensions: 384
    max_input_tokens: 256
    embed_budget_ratio: 0.90
    model_path: ../../../.realworld/models/paraphrase-multilingual-MiniLM-L12-v2
    batch_size: 8
    timeout_seconds: 60

indexing:
  extensions:
    - .py
    - .go
    - .js
    - .jsx
    - .mjs
    - .cjs
    - .ts
    - .tsx
    - .md
    - .markdown
    - .mdc
    - .txt
    - .yaml
    - .yml
    - .sql
    - .sh
    - .java
    - .bsl
    - .os
    - .dcs
  skip_dirs:
    - .git
    - .deps
    - node_modules
    - vendor
    - .realworld
    - .mcp-semantic-search-zvec-go
  chunking:
    strategy: hybrid
    version: 1
    size_metric: tokens
    min_chunk_tokens: 10
    prose_overlap_ratio: 0.12
    context_prefix: false
    line_window:
      window_lines: 40
      overlap_lines: 8
    languages:
      go: { enabled: true }
      python: { enabled: true }
      javascript: { enabled: true }
      typescript: { enabled: true }
      bsl: { enabled: true, include_sdbl: true }

search:
  slow_threshold_seconds: 30.0

file_watcher:
  enabled: false
  backend: polling

logging:
  level: info

server:
  http_addr: "127.0.0.1:8080"
