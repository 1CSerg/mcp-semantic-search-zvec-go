name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; ensuring draft"
            gh release edit "$tag" --draft=true || true
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi

  build:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: windows
            goarch: amd64
            runner: windows-latest
          # macOS release is arm64-only (zvec-go prebuilts; macos-13 retired).
          - goos: darwin
            goarch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Extract version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version file
        shell: bash
        run: |
          want="${{ steps.ver.outputs.version }}"
          got=$(awk -F'"' '/^\tVersion = / { print $2; exit }' internal/version/version.go)
          if [ "$want" != "$got" ]; then
            echo "Tag v$want does not match internal/version/version.go ($got)"
            exit 1
          fi

      - name: Fetch native deps (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/fetch/fetch-zvec-libs.sh >> "$GITHUB_ENV"
          bash scripts/fetch/fetch-onnx-runtime.sh >> "$GITHUB_ENV"

      - name: Fetch native deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts/fetch/fetch-zvec-libs.ps1 | Out-Null
          & scripts/fetch/fetch-onnx-runtime.ps1 | Out-Null
          Get-Content .deps/zvec-lib.env | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])" }
          }
          Get-Content .deps/onnxruntime.env | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])" }
          }

      - name: Install MSYS2 GCC (Windows tree-sitter)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Fetch tree-sitter grammars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\fetch\fetch-tree-sitter-grammars.ps1

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ env.ZVEC_LIB_DIR }}:${{ env.ORT_LIB_DIR }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/mcp-semantic-search-zvec-go_${{ steps.ver.outputs.version }}_${GOOS}_${GOARCH}${ext}"
          mkdir -p dist/release-libs
          go build -tags "zvec,onnx,treesitter" -ldflags="-s -w" -o "$out" ./cmd/mcp-semantic-search-zvec-go
          pkg="dist/pkg-${GOOS}-${GOARCH}"
          mkdir -p "$pkg"
          cp -f "$out" "$pkg/"
          case "$GOOS" in
            linux) cp -f "$ZVEC_LIB_DIR/libzvec_c_api.so" "$pkg/" ;;
            darwin) cp -f "$ZVEC_LIB_DIR/libzvec_c_api.dylib" "$pkg/" ;;
          esac
          cp -f "$ONNXRUNTIME_SHARED_LIBRARY_PATH" "$pkg/"
          tar -czf "dist/mcp-semantic-search-zvec-go_${{ steps.ver.outputs.version }}_${GOOS}_${GOARCH}.tar.gz" -C "$pkg" .

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          . ./scripts/dev/ci-native-env.ps1
          $out = "dist/mcp-semantic-search-zvec-go_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.exe"
          New-Item -ItemType Directory -Force -Path dist/release-libs | Out-Null
          go build -tags "zvec,onnx,treesitter" -ldflags="-s -w" -o $out ./cmd/mcp-semantic-search-zvec-go
          Copy-Item -Force "$env:ZVEC_LIB_DIR/zvec_c_api.dll" dist/release-libs/
          Copy-Item -Force "$env:ONNXRUNTIME_SHARED_LIBRARY_PATH" dist/release-libs/
          Compress-Archive -Path $out, dist/release-libs/* -DestinationPath "dist/mcp-semantic-search-zvec-go_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" -Force

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release archives in dist/"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}"

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          count="$(gh release view "$tag" --json assets -q '.assets | length')"
          echo "Release assets: $count"
          if [ "$count" -lt 4 ]; then
            echo "Expected 4 platform archives, got $count"
            exit 1
          fi
          gh release edit "$tag" --draft=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/1cserg/mcp-semantic-search-zvec-go:${{ steps.ver.outputs.version }}
            ghcr.io/1cserg/mcp-semantic-search-zvec-go:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
