name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Coverage check (project min 85%, module min 50%)
        run: bash scripts/dev/check-coverage.sh
        env:
          COVERAGE_MIN: "85"
          COVERAGE_PKG_MIN: "50"
          COVERAGE_PACKAGES: "./internal/..."

      - name: go vet
        run: go vet ./...

  zvec-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Fetch zvec-go vendor libs
        run: bash scripts/fetch/fetch-zvec-libs.sh >> "$GITHUB_ENV"

      - name: Integration tests (zvec)
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ env.ZVEC_LIB_DIR }}
        run: go test -tags "integration,zvec" -v -count=1 ./internal/store/zvec/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Test (Windows)
        run: go test ./... -count=1
