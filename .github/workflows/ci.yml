name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Coverage check (project min 80%, module min 50%)
        run: bash scripts/dev/check-coverage.sh
        env:
          COVERAGE_MIN: "80"
          COVERAGE_PKG_MIN: "50"
          COVERAGE_PACKAGES: "./internal/..."

      - name: go vet
        run: go vet ./...

  zvec-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Fetch zvec-go vendor libs
        run: bash scripts/fetch/fetch-zvec-libs.sh >> "$GITHUB_ENV"

      - name: Integration tests (zvec)
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ env.ZVEC_LIB_DIR }}
        run: go test -tags "integration,zvec" -v -count=1 ./internal/store/zvec/...

  treesitter-chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Fetch zvec-go vendor libs
        run: bash scripts/fetch/fetch-zvec-libs.sh >> "$GITHUB_ENV"

      - name: AST chunk tests (tree-sitter + CGO)
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ env.ZVEC_LIB_DIR }}
        run: go test -tags "zvec,treesitter" -v -count=1 ./internal/indexer/chunk/...

      - name: AST package coverage (min 80%)
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ env.ZVEC_LIB_DIR }}
        run: |
          go test -tags "zvec,treesitter" -coverprofile=coverage-ast.out ./internal/indexer/chunk/ast/...
          total="$(go tool cover -func=coverage-ast.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "ast coverage: ${total}%"
          awk -v total="$total" 'BEGIN {
            if (total + 0 < 80) {
              printf "ast coverage %.1f%% is below minimum 80%%\n", total > "/dev/stderr"
              exit 1
            }
          }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Test (Windows)
        run: go test ./... -count=1

      - name: Fetch zvec-go vendor libs
        shell: bash
        run: bash scripts/fetch/fetch-zvec-libs.sh >> $GITHUB_ENV

      - name: Tree-sitter CGO spike
        shell: pwsh
        run: .\scripts\fetch\fetch-tree-sitter-grammars.ps1

      - name: AST chunk tests (tree-sitter + CGO)
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          Get-Content .deps/zvec-lib.env | ForEach-Object {
            if ($_ -match '^ZVEC_LIB_DIR=(.+)$') { $env:PATH = "$($Matches[1]);$env:PATH" }
          }
          go test -tags "zvec,treesitter" -count=1 ./internal/indexer/chunk/...
